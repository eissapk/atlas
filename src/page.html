<script>
  import { onMount } from "olum";
  import { WorldMap, mergeCountries } from "worldmap";
  // All 239 countries the map draws, generated by scripts/build-country-data.js.
  // The engine reads only `name` and `disabled`; the rest is ours.
  import { countries } from "./countries.js";

  import Sheet from "./components/ui/Sheet/Sheet";
  import SheetContent from "./components/ui/Sheet/SheetContent";
  import SheetHeader from "./components/ui/Sheet/SheetHeader";
  import SheetTitle from "./components/ui/Sheet/SheetTitle";
  import SheetDescription from "./components/ui/Sheet/SheetDescription";
  import SheetFooter from "./components/ui/Sheet/SheetFooter";
  import SheetClose from "./components/ui/Sheet/SheetClose";

  // --- Merge countries into one region -------------------------------------
  // The key becomes the region's country id, so it is what `data` is keyed by,
  // what selectCountry() takes, and what lands in data-country-id.
  const merges = {
    // Israel (376) + Palestine (275, two pieces: the West Bank and Gaza).
    // Rename it to whatever you need — the label is entirely yours.

    // levant: { name: "Palestine", members: ["376", "275"] },
  };

  // Data for the merged regions, same shape as any other country.
  const regionData = {
    // Capital and currency are left out rather than picking one of the two.
    // levant: {
    //   name: "Palestine",
    //   continent: "Asia",
    //   region: "Western Asia",
    //   area: 26990,
    // },
  };

  const markers = [
    { id: "cairo", lat: 30.0444, lon: 31.2357, label: "Cairo" },
    { id: "london", lat: 51.5072, lon: -0.1276, label: "London" },
  ];

  onMount(() => {
    let map = null;
    let cancelled = false;

    // Everything below is resolved lazily rather than cached at mount time:
    // this hook runs before the Sheet's own components mount, and SheetContent
    // then moves the panel out into <body>, so any reference taken now could
    // be stale by the time it is used.
    const sheetInput = () =>
      document.querySelector('[data-slot="sheet"] > input');

    const setSheet = (open) => {
      const input = sheetInput();
      if (!input || input.checked === open) return;
      input.checked = open;
      // The Sheet is driven by the checkbox's change event — the same thing
      // SheetTrigger fires. Setting `.checked` alone would not notify it.
      input.dispatchEvent(new Event("change", { bubbles: true }));
    };

    const row = (label, value) => {
      const dt = document.createElement("dt");
      dt.className = "text-muted-foreground";
      dt.textContent = label;
      const dd = document.createElement("dd");
      dd.className = "text-foreground";
      dd.textContent = value;
      return [dt, dd];
    };

    const showCountry = (country) => {
      const title = document.querySelector("#country-name");
      const sub = document.querySelector("#country-sub");
      const details = document.querySelector("#country-details");
      if (!title || !sub || !details) return;

      if (!country) {
        title.textContent = "World";
        sub.textContent = "Click a country to see its details.";
        details.replaceChildren();
        return;
      }

      title.textContent = country.flag
        ? `${country.flag} ${country.name}`
        : country.name;

      sub.textContent =
        country.official && country.official !== country.name
          ? country.official
          : country.recognised === false
            ? "Disputed or partially recognised."
            : country.continent || "";

      const currency =
        country.currency && country.currencyCode
          ? `${country.currency} (${country.currencyCode})`
          : country.currency;

      const rows = [
        ["Capital", country.capital],
        ["Continent", country.continent],
        ["Region", country.region],
        ["Currency", currency],
        ["Languages", country.languages],
        ["Calling code", country.callingCode],
        ["Area", typeof country.area === "number"
          ? `${country.area.toLocaleString("en")} km²`
          : ""],
        ["ISO", [country.iso2, country.iso3].filter(Boolean).join(" · ")],
      ].filter(([, value]) => value);

      details.replaceChildren(...rows.flatMap(([k, v]) => row(k, v)));
    };

    // The geometry is a static file in /public — no CDN, no TopoJSON decoding.
    fetch("/world-50m.json")
      .then((response) => {
        if (!response.ok) throw new Error(`Map data ${response.status}`);
        return response.json();
      })
      .then((raw) => {
        if (cancelled) return;

        map = new WorldMap(document.querySelector("#map"), {
          geometry: mergeCountries(raw, merges),
          data: { ...countries, ...regionData },
          label: "Interactive world map",
          onCountryClick: (country) => {
            if (!country) return setSheet(false);
            showCountry(country);
            setSheet(true);
          },
        });

        markers.forEach((marker) => map.addMarker(marker));

        document.querySelector("#zoomIn").onclick = () => map.zoomIn();
        document.querySelector("#zoomOut").onclick = () => map.zoomOut();
        document.querySelector("#reset").onclick = () => {
          map.reset();
          map.clearSelection();
          showCountry(null);
          setSheet(false);
        };

        const fullscreen = document.querySelector("#fullscreen");
        if (!document.documentElement.requestFullscreen) {
          fullscreen.hidden = true;
        } else {
          fullscreen.onclick = () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen().catch(() => {});
          };
        }

        // Closing the sheet drops the highlight, so the two never disagree.
        const input = sheetInput();
        const onSheetChange = () => {
          if (!input.checked) map?.clearSelection();
        };
        input?.addEventListener("change", onSheetChange);
        cleanupSheet = () => input?.removeEventListener("change", onSheetChange);
      })
      .catch((error) => {
        console.error(error);
        showCountry(null);
      });

    let cleanupSheet = null;

    return () => {
      cancelled = true;
      cleanupSheet?.();
      map?.destroy();
    };
  });
</script>
<main class="app">
  <!-- The map fills the viewport; the controls float over it. -->
  <div id="map"></div>

  <h1 class="title">World Map</h1>

  <!-- Icon-only map controls. Each button keeps a visible-on-focus outline and
       an aria-label, because an icon alone says nothing to a screen reader. -->
  <div class="map-controls">
    <button id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5" /></svg>
    </button>
    <button id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.25 8h9.5" /></svg>
    </button>
    <button id="reset" type="button" aria-label="Reset view" title="Reset view">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="5.25" />
        <path d="M2.75 8h10.5M8 2.75c1.5 1.6 2.25 3.35 2.25 5.25S9.5 11.65 8 13.25C6.5 11.65 5.75 9.9 5.75 8S6.5 4.35 8 2.75Z" />
      </svg>
    </button>
    <button id="fullscreen" type="button" aria-label="Toggle full screen" title="Full screen">
      <svg class="icon-enter" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M6 2.75H2.75V6M10 2.75h3.25V6M13.25 10v3.25H10M6 13.25H2.75V10" />
      </svg>
      <svg class="icon-exit" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2.75 6H6V2.75M13.25 6H10V2.75M10 13.25V10h3.25M6 13.25V10H2.75" />
      </svg>
    </button>
  </div>

  <!-- The selected country's details. Opened by clicking a country, not by a
       trigger button — the map is the trigger. -->
  <Sheet>
    <SheetContent side="left">
      <SheetHeader>
        <SheetTitle><span id="country-name">World</span></SheetTitle>
        <SheetDescription><span id="country-sub">Click a country to see its details.</span></SheetDescription>
      </SheetHeader>

      <dl id="country-details" class="grid grid-cols-[auto_1fr] items-baseline gap-x-5 gap-y-2 overflow-y-auto px-4 text-sm"></dl>

      <SheetFooter>
        <SheetClose class="inline-flex h-8 w-full items-center justify-center rounded-lg border border-border bg-background px-2.5 text-sm hover:bg-muted">Close</SheetClose>
      </SheetFooter>
    </SheetContent>
  </Sheet>
</main>
