<script>
  import { onMount } from "olum";
  import { select, geoNaturalEarth1, geoPath } from "d3";
  import { feature } from "topojson-client";


  // --------------------------------------------------
  // Configuration
  // --------------------------------------------------

  const WIDTH = 1000;
  const HEIGHT = 600;

  const ATLAS_URL =
      "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json";


  // --------------------------------------------------
  // Country information
  // --------------------------------------------------

  const countryData = {

      "818": {
          capital: "Cairo",
          continent: "Africa",
          currency: "Egyptian Pound"
      },

      "682": {
          capital: "Riyadh",
          continent: "Asia",
          currency: "Saudi Riyal"
      },

      "840": {
          capital: "Washington, D.C.",
          continent: "North America",
          currency: "US Dollar"
      },

      "826": {
          capital: "London",
          continent: "Europe",
          currency: "Pound Sterling"
      }

  };


  // The DOM only exists once the component is mounted, so every query,
  // listener and d3 selection lives inside onMount.
  onMount(() => {

      let cancelled = false;

      const svg = select("#map");
      const info = document.querySelector("#info");


      // --------------------------------------------------
      // Projection
      // --------------------------------------------------

      const projection = geoNaturalEarth1()
          .scale(170)
          .translate([WIDTH / 2, HEIGHT / 2]);

      const path = geoPath()
          .projection(projection);

      const mapGroup = svg
          .append("g")
          .attr("class", "map");


      // --------------------------------------------------
      // Load world data and render countries
      // --------------------------------------------------

      async function loadMap() {

          const response = await fetch(ATLAS_URL);

          if (!response.ok) {
              throw new Error(
                  "Failed to load world atlas (" + response.status + ")"
              );
          }

          const world = await response.json();

          if (cancelled) return;

          const countries = feature(
              world,
              world.objects.countries
          );

          mapGroup
              .selectAll(".country")
              .data(countries.features)
              .join("path")
              .attr("class", "country")
              .attr("d", path)
              .attr("data-id", d => d.id)
              .attr("data-name", d => d.properties.name)
              .on("click", function(event, country) {

                  event.stopPropagation();

                  // Remove previous selection
                  mapGroup
                      .selectAll(".country")
                      .classed("selected", false);

                  // Select this country
                  select(this)
                      .classed("selected", true);

                  showCountry(country);
              });

      }

      loadMap().catch(error => {

          console.error(error);

          info.innerHTML = "<h2>World</h2><p>Could not load the map.</p>";

      });


      function showCountry(country) {

          const id = country.id;

          const data = countryData[id];

          info.innerHTML = `

              <h2>${country.properties.name}</h2>

              ${
                  data
                      ? `
                          <p><strong>Capital:</strong> ${data.capital}</p>
                          <p><strong>Continent:</strong> ${data.continent}</p>
                          <p><strong>Currency:</strong> ${data.currency}</p>
                      `
                      : `
                          <p>No additional data yet.</p>
                      `
              }

          `;
      }


      // --------------------------------------------------
      // Zoom / Pan
      // --------------------------------------------------

      let scale = 1;
      let x = 0;
      let y = 0;

      function updateTransform() {

          mapGroup.attr(
              "transform",
              `translate(${x} ${y}) scale(${scale})`
          );

      }


      // Zoom buttons

      document
          .querySelector("#zoomIn")
          .addEventListener("click", () => {

              scale = Math.min(scale * 1.3, 8);

              updateTransform();

          });


      document
          .querySelector("#zoomOut")
          .addEventListener("click", () => {

              scale = Math.max(scale / 1.3, 1);

              updateTransform();

          });


      document
          .querySelector("#reset")
          .addEventListener("click", () => {

              scale = 1;
              x = 0;
              y = 0;

              updateTransform();

          });


      // --------------------------------------------------
      // Dragging
      // --------------------------------------------------

      let dragging = false;
      let startX = 0;
      let startY = 0;

      svg
          .on("pointerdown", event => {

              dragging = true;

              startX = event.clientX - x;
              startY = event.clientY - y;

              svg.node().setPointerCapture(event.pointerId);

          })
          .on("pointermove", event => {

              if (!dragging) return;

              x = event.clientX - startX;
              y = event.clientY - startY;

              updateTransform();

          })
          .on("pointerup pointercancel", () => {

              dragging = false;

          });


      // --------------------------------------------------
      // Mouse wheel zoom
      // --------------------------------------------------

      svg.on("wheel", event => {

          event.preventDefault();

          const factor = event.deltaY < 0
              ? 1.15
              : 1 / 1.15;

          scale = Math.max(
              1,
              Math.min(8, scale * factor)
          );

          updateTransform();

      }, { passive: false });


      return () => {

          cancelled = true;

      };

  });
</script>
<main>
  <div class="app">
    <h1>World Map</h1>

    <div class="controls">
      <button id="zoomIn">+</button>
      <button id="zoomOut">−</button>
      <button id="reset">Reset</button>
    </div>

    <div class="map-container">
      <svg id="map" viewBox="0 0 1000 600" aria-label="Interactive world map"></svg>

      <div class="info" id="info">
        <h2>World</h2>
        <p>Click a country.</p>
      </div>
    </div>
  </div>
</main>
